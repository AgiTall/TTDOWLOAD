services:
  - type: web
    name: telegram-media-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: MAX_UPLOAD_MB
        value: "49"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
