services:
  - type: web
    name: telegram-media-downloader
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_EXTENDED_ACCESS
        value: "0"
      - key: PAYMENT_SUPPORT_USERNAME
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_UPLOAD_MB
        value: "49"
      - key: MAX_CONCURRENT_DOWNLOADS
        value: "2"
      - key: COBALT_API_URL
        value: "https://api.cobalt.tools"
      - key: COBALT_API_KEY
        sync: false
      - key: COBALT_DISABLED
        value: "0"
      - key: YT_COOKIES_FILE
        sync: false
